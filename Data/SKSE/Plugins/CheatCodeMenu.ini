[Hotkey]
; DirectX scan code for menu hotkey (-1 disables the hotkey)
; F9 = 0x43 (67 decimal)
ScanCode = -1

[Menu]
; Text displayed on the System menu button
ButtonText = CHEAT CODES

[Settings]
; Automatically unlock all cheats in the menu, bypassing the need to input codes.
UnlockAllCodes = false

[Messages]
CodeAccepted = Code accepted!
InvalidCode = Invalid code.
CheatExecuted = Cheat executed!
CheatEnabled = Cheat enabled!
CheatDisabled = Cheat disabled.
ActivationFailed = Activation failed.
CheatLocked = This cheat is locked.
